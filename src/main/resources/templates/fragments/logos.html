<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <section th:fragment="logos" class="py-12 border-y border-slate-100 dark:border-slate-800/80 bg-slate-50/50 dark:bg-slate-900/40 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <p class="text-xs sm:text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-8">
        Powered by industry-standard open-source technologies
      </p>
      
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-6 sm:gap-8 items-center justify-center opacity-75 dark:opacity-60 hover:opacity-100 transition-opacity">
        
        <!-- Spring Boot -->
        <div class="flex items-center justify-center gap-2 font-bold text-slate-800 dark:text-slate-200 text-sm sm:text-base">
          <span class="text-emerald-500 text-xl font-mono">🍃</span> Spring Boot 3
        </div>

        <!-- Kotlin -->
        <div class="flex items-center justify-center gap-2 font-bold text-slate-800 dark:text-slate-200 text-sm sm:text-base">
          <span class="text-purple-500 text-xl font-mono">🟣</span> Kotlin 2.1
        </div>

        <!-- Thymeleaf -->
        <div class="flex items-center justify-center gap-2 font-bold text-slate-800 dark:text-slate-200 text-sm sm:text-base">
          <span class="text-teal-500 text-xl font-mono">🌿</span> Thymeleaf
        </div>

        <!-- HTMX -->
        <div class="flex items-center justify-center gap-2 font-bold text-slate-800 dark:text-slate-200 text-sm sm:text-base">
          <span class="text-indigo-500 text-xl font-mono">&lt;/&gt;</span> HTMX 2.0
        </div>

        <!-- Tailwind CSS -->
        <div class="flex items-center justify-center gap-2 font-bold text-slate-800 dark:text-slate-200 text-sm sm:text-base">
          <span class="text-sky-500 text-xl font-mono">🎨</span> Tailwind v4
        </div>

        <!-- Docker -->
        <div class="flex items-center justify-center gap-2 font-bold text-slate-800 dark:text-slate-200 text-sm sm:text-base">
          <span class="text-blue-500 text-xl font-mono">🐳</span> Docker Ready
        </div>

      </div>
    </div>
  </section>
</html>
