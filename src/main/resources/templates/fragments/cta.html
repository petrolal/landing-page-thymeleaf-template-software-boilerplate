<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <section th:fragment="cta" class="py-20 sm:py-28 bg-gradient-to-b from-white via-indigo-50/40 to-white dark:from-slate-900 dark:via-indigo-950/20 dark:to-slate-900 transition-colors">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <div class="rounded-3xl p-8 sm:p-14 bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-700 text-white text-center shadow-2xl relative overflow-hidden">
        <!-- Decorative Glow -->
        <div class="absolute -top-24 -right-24 w-72 h-72 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-72 h-72 bg-purple-500/20 rounded-full blur-2xl pointer-events-none"></div>

        <h2 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold tracking-tight mb-4">
          Ready to launch your next project?
        </h2>
        
        <p class="text-indigo-100 text-base sm:text-lg max-w-2xl mx-auto mb-10 leading-relaxed">
          Join thousands of developers scaffolding modern Spring Boot applications in seconds with JBang and Tailwind CSS.
        </p>

        <!-- Embedded Interactive Waitlist / Newsletter Form -->
        <div class="max-w-md mx-auto mb-8">
          <th:block th:replace="~{fragments/forms :: newsletter-form}"></th:block>
        </div>

        <p class="text-xs text-indigo-200">
          Instant setup • No credit card required • Open Source Apache 2.0
        </p>
      </div>

    </div>
  </section>
</html>
