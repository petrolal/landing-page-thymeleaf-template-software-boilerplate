<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <section th:fragment="cta" class="py-20 sm:py-28 bg-gradient-to-b from-white via-indigo-50/40 to-white dark:from-slate-900 dark:via-indigo-950/20 dark:to-slate-900 transition-colors">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <div class="rounded-3xl p-8 sm:p-14 bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-700 text-white text-center shadow-2xl relative overflow-hidden">
        <!-- Decorative Glow -->
        <div class="absolute -top-24 -right-24 w-72 h-72 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-72 h-72 bg-purple-500/20 rounded-full blur-2xl pointer-events-none"></div>

        <h2 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold tracking-tight mb-4">
          Ready to build your next open source tool?
        </h2>
        
        <p class="text-indigo-100 text-base sm:text-lg max-w-2xl mx-auto mb-8 leading-relaxed">
          Clone the repository, read the LazyVim-style docs, or scaffold in one command with JBang. 100% free and open source.
        </p>

        <!-- Embedded Interactive Waitlist / Newsletter Form -->
        <div class="max-w-md mx-auto mb-8">
          <th:block th:replace="~{fragments/forms :: newsletter-form}"></th:block>
        </div>

        <!-- Action Links -->
        <div class="flex flex-wrap items-center justify-center gap-4 mb-6">
          <a th:href="@{/docs}"
             class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-white text-indigo-700 hover:bg-indigo-50 font-bold text-sm shadow-md transition-all hover:scale-105">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
            <span>Read Documentation</span>
          </a>

          <a th:if="${#strings.length(landing.social.github) > 0}"
             th:href="${landing.social.github}"
             target="_blank"
             rel="noopener noreferrer"
             class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-indigo-900/60 hover:bg-indigo-900/80 text-white font-semibold text-sm border border-indigo-400/30 transition-all hover:scale-105">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
            </svg>
            <span>GitHub Repository</span>
          </a>
        </div>

        <p class="text-xs text-indigo-200">
          GNU General Public License v3.0 • Maintained by Petrolal & the Open Source Community
        </p>
      </div>

    </div>
  </section>
</html>
