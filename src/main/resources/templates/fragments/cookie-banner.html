<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <div th:fragment="banner" id="cookie-banner" class="fixed bottom-4 right-4 max-w-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-2xl rounded-2xl p-5 z-50 transition-all duration-300 transform translate-y-0 hidden">
    <div class="flex items-start gap-3">
      <div class="text-2xl flex-shrink-0">🍪</div>
      <div class="flex-1 text-sm text-slate-600 dark:text-slate-300">
        <p class="font-semibold text-slate-900 dark:text-white mb-1">We value your privacy</p>
        <p>We use essential cookies and anonymized metrics to give you the best experience on our site.</p>
      </div>
    </div>
    <div class="mt-4 flex justify-end gap-2">
      <button type="button" onclick="handleCookieChoice(false)" class="px-3 py-1.5 text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white rounded-lg transition-colors">
        Decline
      </button>
      <button type="button" onclick="handleCookieChoice(true)" class="px-4 py-1.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition-colors">
        Accept
      </button>
    </div>

    <script>
      (function() {
        const consent = localStorage.getItem('cookie-consent');
        const banner = document.getElementById('cookie-banner');
        if (!consent && banner) {
          banner.classList.remove('hidden');
        }
      })();

      function handleCookieChoice(accepted) {
        localStorage.setItem('cookie-consent', accepted ? 'accepted' : 'declined');
        const banner = document.getElementById('cookie-banner');
        if (banner) {
          banner.classList.add('opacity-0', 'translate-y-4');
          setTimeout(() => banner.remove(), 300);
        }
      }
    </script>
  </div>
</html>
