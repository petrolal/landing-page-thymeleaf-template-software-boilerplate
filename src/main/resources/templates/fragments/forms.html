<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body>

    <!-- ========================================== -->
    <!-- 1. NEWSLETTER / WAITLIST FORM FRAGMENTS    -->
    <!-- ========================================== -->

    <!-- Initial Newsletter Form -->
    <form th:fragment="newsletter-form"
          id="newsletter-form"
          hx-post="/api/leads/newsletter"
          hx-swap="outerHTML"
          class="flex flex-col sm:flex-row items-center gap-3 w-full max-w-md mx-auto">
      
      <!-- Anti-Spam Honeypot (hidden from real users) -->
      <div style="display:none !important;" aria-hidden="true">
        <input type="text" name="honeypot" tabindex="-1" autocomplete="off" />
      </div>

      <div class="relative w-full">
        <input type="email"
               name="email"
               required
               placeholder="Enter your email address"
               class="w-full px-4 py-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm text-sm" />
      </div>

      <button type="submit"
              class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-3 rounded-xl font-bold text-sm text-white bg-indigo-600 hover:bg-indigo-500 shadow-md shadow-indigo-600/30 transition-all flex-shrink-0">
        <span>Subscribe</span>
        <!-- HTMX Loading Indicator -->
        <span class="htmx-indicator ml-2 animate-spin">⏳</span>
      </button>
    </form>

    <!-- Newsletter Success Partial -->
    <div th:fragment="newsletter-success" class="p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-200 flex items-center gap-3 max-w-md mx-auto">
      <span class="text-xl">✅</span>
      <div>
        <p class="font-bold text-sm" th:text="${message}">Thank you for subscribing!</p>
        <p class="text-xs text-emerald-700 dark:text-emerald-300">We'll send updates directly to your inbox.</p>
      </div>
    </div>

    <!-- Newsletter Error Partial -->
    <div th:fragment="newsletter-error" class="max-w-md mx-auto space-y-3">
      <div class="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-rose-800 dark:text-rose-200 text-xs font-semibold flex items-center gap-2">
        <span>⚠️</span>
        <span th:text="${error}">Please provide a valid email.</span>
      </div>
      <th:block th:replace="~{fragments/forms :: newsletter-form}"></th:block>
    </div>


    <!-- ========================================== -->
    <!-- 2. FULL CONTACT INQUIRY FORM FRAGMENTS     -->
    <!-- ========================================== -->

    <!-- Initial Contact Form -->
    <form th:fragment="contact-form"
          id="contact-form"
          hx-post="/api/leads/contact"
          hx-swap="outerHTML"
          class="space-y-4 text-left">
      
      <!-- Anti-Spam Honeypot -->
      <div style="display:none !important;" aria-hidden="true">
        <input type="text" name="honeypot" tabindex="-1" autocomplete="off" />
      </div>

      <!-- Name & Email row -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Your Name</label>
          <input type="text"
                 name="name"
                 required
                 th:value="${contactRequest != null ? contactRequest.name : ''}"
                 placeholder="Jane Doe"
                 class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm shadow-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
          <input type="email"
                 name="email"
                 required
                 th:value="${contactRequest != null ? contactRequest.email : ''}"
                 placeholder="jane@company.com"
                 class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm shadow-sm" />
        </div>
      </div>

      <!-- Subject Selection -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Interest / Topic</label>
        <select name="subject"
                class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm shadow-sm">
          <option value="General Inquiry">General Question</option>
          <option value="Enterprise Sales">Enterprise / Commercial License</option>
          <option value="Custom Development">Custom Integration Support</option>
          <option value="Partnership">Partnership</option>
        </select>
      </div>

      <!-- Message Area -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Message</label>
        <textarea name="message"
                  required
                  rows="4"
                  placeholder="Tell us about your project or what you'd like to achieve..."
                  th:text="${contactRequest != null ? contactRequest.message : ''}"
                  class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm shadow-sm"></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit"
              class="w-full py-3 px-6 rounded-xl font-bold text-sm text-white bg-indigo-600 hover:bg-indigo-500 shadow-md shadow-indigo-600/30 transition-all flex items-center justify-center gap-2">
        <span>Send Message</span>
        <span class="htmx-indicator animate-spin">⏳</span>
      </button>
    </form>

    <!-- Contact Success Partial -->
    <div th:fragment="contact-success" class="p-6 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-center space-y-3">
      <div class="w-12 h-12 rounded-full bg-emerald-100 dark:bg-emerald-900/60 text-emerald-600 dark:text-emerald-300 flex items-center justify-center text-2xl mx-auto">
        ✓
      </div>
      <h4 class="font-bold text-lg text-emerald-900 dark:text-emerald-100" th:text="${message}">Message Received!</h4>
      <p class="text-sm text-emerald-700 dark:text-emerald-300">Our team will review your message and reply via email shortly.</p>
    </div>

    <!-- Contact Error Partial -->
    <div th:fragment="contact-error" class="space-y-4">
      <div class="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-rose-800 dark:text-rose-200 text-xs font-semibold flex items-center gap-2">
        <span>⚠️</span>
        <span th:text="${error}">Please check your input.</span>
      </div>
      <th:block th:replace="~{fragments/forms :: contact-form}"></th:block>
    </div>

  </body>
</html>
