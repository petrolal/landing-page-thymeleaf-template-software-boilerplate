<!doctype html>
<html lang="en" class="dark" xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="common-header(pageTitle)">
    <th:block th:replace="~{fragments/seo :: seo-tags}"></th:block>

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Compiled Tailwind CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" />

    <!-- HTMX Core -->
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>

    <!-- Permanent Dark Mode Init -->
    <script>
      document.documentElement.classList.add('dark');
    </script>

    <!-- Optional Analytics Snippets -->
    <th:block th:replace="~{fragments/analytics :: scripts}"></th:block>

    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100"></body>
</html>
