<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <!-- Sidebar Fragment for Desktop and Mobile Drawer -->
  <aside th:fragment="sidebar" id="docs-sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 lg:static lg:block lg:z-0 lg:w-64 xl:w-72 lg:shrink-0 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out">
    
    <div class="h-full flex flex-col justify-between overflow-y-auto px-4 py-6">
      
      <div class="space-y-6">
        
        <!-- Mobile Sidebar Close Header -->
        <div class="flex items-center justify-between lg:hidden pb-4 border-b border-slate-200 dark:border-slate-800">
          <div class="flex items-center gap-2">
            <span class="font-bold text-slate-900 dark:text-white text-base">Navigation</span>
          </div>
          <button type="button"
                  id="docs-mobile-sidebar-close"
                  class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                  aria-label="Close menu">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Documentation Navigation Categories Tree -->
        <nav class="space-y-6 text-sm">
          <div th:each="category : ${categories}" class="space-y-2">
            
            <!-- Category Title & Icon -->
            <div class="flex items-center gap-2 px-2 text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">
              <span th:text="${category.icon}">🚀</span>
              <span th:text="${category.name}">Getting Started</span>
            </div>

            <!-- Pages in Category -->
            <ul class="space-y-1">
              <li th:each="navPage : ${category.pages}">
                <a th:href="@{${navPage.url}}"
                   th:class="${activeSlug == navPage.slug ?
                     'flex items-center justify-between px-3 py-2 rounded-lg text-sm font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border-l-2 border-indigo-600 dark:border-indigo-400 transition-colors' :
                     'flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100/70 dark:hover:bg-slate-800/60 transition-colors'}">
                  
                  <span class="truncate" th:text="${navPage.title}">Overview</span>

                  <!-- Page Badge (if any) -->
                  <span th:if="${navPage.badge != null}"
                        th:text="${navPage.badge}"
                        th:class="${activeSlug == navPage.slug ?
                          'text-[10px] font-semibold px-1.5 py-0.5 rounded bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 ml-2 shrink-0' :
                          'text-[10px] font-semibold px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 ml-2 shrink-0'}">
                    New
                  </span>
                </a>
              </li>
            </ul>

          </div>
        </nav>

      </div>

      <!-- Sidebar Bottom Info -->
      <div class="pt-4 mt-6 border-t border-[#2A2C36] space-y-2">
        <a th:if="${#strings.length(landing.social.discord) > 0}"
           th:href="${landing.social.discord}"
           target="_blank"
           rel="noopener noreferrer"
           class="flex items-center justify-between p-2.5 rounded-xl bg-[#1E1F26] hover:bg-[#2A2C36] border border-[#2A2C36] hover:border-[#C792EA]/50 transition-colors group">
          <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4 text-[#C792EA]" fill="currentColor" viewBox="0 0 24 24">
              <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
            <div class="text-xs">
              <span class="font-semibold text-[#BCBEC4] block">Discord Community</span>
              <span class="text-[#8A8D94]">Get help & chat</span>
            </div>
          </div>
          <svg class="w-3.5 h-3.5 text-[#8A8D94] group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>

        <a th:if="${#strings.length(landing.social.github) > 0}"
           th:href="${landing.social.github}"
           target="_blank"
           rel="noopener noreferrer"
           class="flex items-center justify-between p-2.5 rounded-xl bg-[#1E1F26] hover:bg-[#2A2C36] border border-[#2A2C36] hover:border-[#9A7FC7]/50 transition-colors group">
          <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4 text-[#BCBEC4]" fill="currentColor" viewBox="0 0 24 24">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
            </svg>
            <div class="text-xs">
              <span class="font-semibold text-[#BCBEC4] block">Star on GitHub</span>
              <span class="text-[#8A8D94]">Open source repository</span>
            </div>
          </div>
          <svg class="w-3.5 h-3.5 text-[#8A8D94] group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>
      </div>

    </div>
  </aside>

  <!-- Mobile Backdrop Overlay -->
  <div id="docs-sidebar-backdrop" class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-xs hidden lg:hidden transition-opacity"></div>
</html>
