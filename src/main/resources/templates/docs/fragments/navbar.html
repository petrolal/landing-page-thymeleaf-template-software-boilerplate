<!doctype html>
<html lang="en" class="dark" xmlns:th="http://www.thymeleaf.org">
  <header th:fragment="navbar" class="sticky top-0 z-40 w-full backdrop-blur-md bg-slate-900/90 border-b border-slate-800 transition-colors">
    <div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Left: Brand & Mobile Sidebar Toggle -->
        <div class="flex items-center gap-3">
          <!-- Mobile Sidebar Drawer Button -->
          <button type="button"
                  id="docs-mobile-sidebar-btn"
                  aria-label="Toggle documentation navigation"
                  class="lg:hidden p-2 rounded-lg text-slate-300 hover:bg-slate-800 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
            </svg>
          </button>

          <!-- Brand Logo & Docs Tag -->
          <a th:href="@{/}" class="flex items-center gap-2.5 group">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold text-sm shadow-md shadow-indigo-500/20 group-hover:scale-105 transition-transform">
              ⚡
            </div>
            <span class="font-extrabold text-lg tracking-tight text-white" th:text="${landing.site.name}">
              AuraLaunch
            </span>
          </a>

          <!-- Docs Breadcrumb Tag -->
          <div class="flex items-center gap-2 ml-1 text-xs text-slate-500">
            <span>/</span>
            <span class="font-semibold text-slate-300">Docs</span>
            <span class="hidden sm:inline-block font-mono text-[11px] text-slate-400" th:text="${landing.docs.version}">v1.0.0</span>
          </div>
        </div>

        <!-- Center: Search Trigger Button (LazyVim / Algolia style) -->
        <div class="flex-1 max-w-md mx-4 hidden md:block">
          <button type="button"
                  onclick="openSearchModal()"
                  class="w-full flex items-center justify-between px-3.5 py-2 text-sm text-slate-400 bg-slate-800/80 hover:bg-slate-700/70 rounded-xl border border-slate-700/60 transition-all shadow-xs cursor-pointer group">
            <span class="flex items-center gap-2">
              <svg class="w-4 h-4 text-slate-400 group-hover:text-indigo-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              <span>Search documentation...</span>
            </span>
            <span class="flex items-center gap-1 font-mono text-[11px] text-slate-400 bg-slate-900 px-1.5 py-0.5 rounded border border-slate-700">
              <kbd class="font-sans">Ctrl</kbd> <kbd>K</kbd>
            </span>
          </button>
        </div>

        <!-- Right Side: Home Link, GitHub -->
        <div class="flex items-center gap-2 sm:gap-3">
          <!-- Mobile Search Icon Button -->
          <button type="button"
                  onclick="openSearchModal()"
                  aria-label="Search"
                  class="md:hidden p-2 rounded-lg text-slate-300 hover:bg-slate-800 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </button>

          <!-- Back to Landing Page -->
          <a th:href="@{/}"
             class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-indigo-400 rounded-lg hover:bg-slate-800 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span>Home</span>
          </a>

          <!-- GitHub Repo Link -->
          <a th:if="${#strings.length(landing.social.github) > 0}"
             th:href="${landing.social.github}"
             target="_blank"
             rel="noopener noreferrer"
             aria-label="GitHub Repository"
             class="p-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition-colors"
             title="GitHub">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
            </svg>
          </a>

          <!-- LinkedIn Link -->
          <a th:if="${#strings.length(landing.social.linkedin) > 0}"
             th:href="${landing.social.linkedin}"
             target="_blank"
             rel="noopener noreferrer"
             aria-label="LinkedIn"
             class="p-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition-colors"
             title="LinkedIn">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 8.76a1.69 1.69 0 1 0 0-3.38 1.69 1.69 0 0 0 0 3.38m1.4 9.74v-8.37H5.06v8.37h2.8z"/>
            </svg>
          </a>

          <!-- Medium Link -->
          <a th:if="${#strings.length(landing.social.medium) > 0}"
             th:href="${landing.social.medium}"
             target="_blank"
             rel="noopener noreferrer"
             aria-label="Medium"
             class="p-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition-colors"
             title="Medium">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M13.54 12a6.8 6.8 0 01-6.77 6.82A6.8 6.8 0 010 12a6.8 6.8 0 016.77-6.82A6.8 6.8 0 0113.54 12zM20.96 12c0 3.54-1.51 6.42-3.38 6.42-1.87 0-3.39-2.88-3.39-6.42s1.52-6.42 3.39-6.42 3.38 2.88 3.38 6.42M24 12c0 3.17-.53 5.75-1.19 5.75-.66 0-1.19-2.58-1.19-5.75s.53-5.75 1.19-5.75C23.47 6.25 24 8.83 24 12z"/>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </header>
</html>
