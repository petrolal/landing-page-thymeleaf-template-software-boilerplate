<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <aside th:fragment="toc" class="hidden xl:block w-64 shrink-0 py-8 pl-6">
    <div class="sticky top-24 space-y-6">
      
      <!-- Table of Contents Container -->
      <div th:if="${page.toc != null and !page.toc.empty}" class="space-y-3">
        <h4 class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-slate-900 dark:text-slate-100">
          <svg class="w-3.5 h-3.5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
          </svg>
          <span>On this page</span>
        </h4>

        <nav class="toc-nav text-xs space-y-1.5 border-l border-slate-200 dark:border-slate-800">
          <a th:each="item : ${page.toc}"
             th:href="'#' + ${item.id}"
             th:data-toc-id="${item.id}"
             th:class="${item.level == 3 ?
               'toc-link block pl-5 py-1 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 border-l-2 border-transparent -ml-px transition-colors truncate' :
               'toc-link block pl-3 py-1 text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 border-l-2 border-transparent -ml-px transition-colors truncate font-medium'}"
             th:text="${item.title}">
            Section Title
          </a>
        </nav>
      </div>

      <!-- Quick Actions / Community -->
      <div class="space-y-3 pt-4 border-t border-slate-200 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400">
        
        <!-- Back to Top -->
        <button type="button"
                onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
                class="flex items-center gap-2 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors cursor-pointer group">
          <svg class="w-3.5 h-3.5 group-hover:-translate-y-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
          </svg>
          <span>Back to top</span>
        </button>

        <!-- Edit Page on GitHub -->
        <a th:if="${#strings.length(landing.docs.githubRepo) > 0}"
           th:href="${landing.docs.githubRepo + '/blob/' + landing.docs.branch + '/src/main/resources/' + page.filePath}"
           target="_blank"
           rel="noopener noreferrer"
           class="flex items-center gap-2 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
          <span>Edit this page on GitHub</span>
        </a>

        <!-- Community / Ask Question on Discord -->
        <a th:if="${#strings.length(landing.social.discord) > 0}"
           th:href="${landing.social.discord}"
           target="_blank"
           rel="noopener noreferrer"
           class="flex items-center gap-2 hover:text-[#C792EA] transition-colors">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          <span>Community Discord</span>
        </a>

      </div>

    </div>
  </aside>
</html>
