name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Verify Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks and tests
        run: ./gradlew check

      - name: Build executable bootJar
        run: ./gradlew bootJar

      - name: Verify Docker build
        run: docker build -t landing-page-thymeleaf-template-first:test .

  test-jbang-template:
    name: Test JBang Template Scaffolding
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup JBang
        uses: jbangdev/setup-jbang@main

      - name: Verify JBang Catalog
        run: |
          jbang alias list --file jbang-catalog.json

      - name: Verify init.kt script help
        run: |
          jbang init.kt --help

      - name: Test End-to-End Scaffolding with JBang
        run: |
          # 1. Package template archive simulating GitHub release tarball
          tar --exclude='./.git' --exclude='./.gradle' --exclude='./build' --exclude='./.kotlin' --exclude='./.bin' \
              -czf /tmp/template.tar.gz -C . .

          # 2. Run JBang init generator
          mkdir -p /tmp/scaffold-test && cd /tmp/scaffold-test
          jbang "$GITHUB_WORKSPACE/init.kt" \
            --archive /tmp/template.tar.gz \
            --package com.example.ci \
            ci-generated-app

          # 3. Verify generated project files
          cd ci-generated-app
          test -f gradlew
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test ! -f init.kt
          test ! -f jbang-catalog.json

          # 4. Verify generated project compiles and passes tests
          ./gradlew check
